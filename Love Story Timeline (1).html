    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Noto Sans TC', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #f0f8ff 100%);
            color: #333;
        }

        /* 色彩系統 - 粉藍溫暖調 */
        :root {
            --primary-pink: #FFB6D9;
            --primary-blue: #A8D8FF;
            --accent-purple: #D8B4FF;
            --warm-peach: #FFD6C9;
            --soft-white: #FFFBFE;
            --text-dark: #4A4A4A;
            --text-light: #8B8B8B;
            --divider: #E8D5E8;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(120deg, #FFB6D9, #A8D8FF, #D8B4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: clamp(14px, 2vw, 18px);
            color: var(--text-light);
            font-weight: 300;
        }

        /* 導航 - 重要事件快速跳轉 */
        .nav-milestone {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            backdrop-filter: blur(10px);
        }

        .milestone-btn {
            padding: 8px 16px;
            border: 2px solid var(--primary-pink);
            background: white;
            color: var(--text-dark);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .milestone-btn:hover {
            background: var(--primary-pink);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 182, 217, 0.3);
        }

        .milestone-btn.active {
            background: var(--primary-pink);
            color: white;
        }

        /* 主要時間軸容器 */
        .timeline-wrapper {
            position: relative;
            display: flex;
            gap: 40px;
            min-height: 100vh;
            align-items: flex-start;
            padding: 40px 0;
        }

        @media (max-width: 1024px) {
            .timeline-wrapper {
                flex-direction: column;
                gap: 20px;
            }
        }

        /* 左側時間軸 (星街彗星) */
        .timeline-track {
            flex: 1;
            position: relative;
        }

        .timeline-track.left::before {
            content: '';
            position: absolute;
            left: 24px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary-pink) 0%, var(--accent-purple) 100%);
            border-radius: 2px;
        }

        .timeline-track.right::before {
            content: '';
            position: absolute;
            right: 24px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary-blue) 0%, var(--accent-purple) 100%);
            border-radius: 2px;
        }

        .timeline-label {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timeline-label::before {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-pink);
        }

        .timeline-track.right .timeline-label::before {
            background: var(--primary-blue);
        }

        /* 時間軸項目 */
        .timeline-item {
            margin-left: 60px;
            margin-bottom: 32px;
            position: relative;
        }

        .timeline-track.right .timeline-item {
            margin-left: 0;
            margin-right: 60px;
        }

        /* 圓點 */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -48px;
            top: 8px;
            width: 20px;
            height: 20px;
            background: white;
            border: 4px solid var(--primary-pink);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timeline-track.right .timeline-item::before {
            left: auto;
            right: -48px;
            border-color: var(--primary-blue);
        }

        .timeline-item:hover::before {
            transform: scale(1.3);
            box-shadow: 0 0 0 8px rgba(255, 182, 217, 0.2);
        }

        .timeline-track.right .timeline-item:hover::before {
            box-shadow: 0 0 0 8px rgba(168, 216, 255, 0.2);
        }

        /* 卡片 */
        .timeline-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            overflow: hidden;
        }

        .timeline-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 182, 217, 0.15);
            border-color: var(--primary-pink);
        }

        .timeline-track.right .timeline-card:hover {
            border-color: var(--primary-blue);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-date {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-pink);
        }

        .timeline-track.right .card-date {
            color: var(--primary-blue);
        }

        .card-category {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary-pink);
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .timeline-track.right .card-category {
            background: var(--primary-blue);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-preview {
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .card-media-thumb {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #FFB6D9 0%, #A8D8FF 100%);
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .card-expand {
            font-size: 12px;
            color: var(--primary-pink);
            font-weight: 600;
        }

        .timeline-track.right .card-expand {
            color: var(--primary-blue);
        }

        /* 詳細內容模態 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
            padding: 40px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--primary-pink);
            color: white;
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-date {
            font-size: 14px;
            color: var(--primary-pink);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .modal-category {
            display: inline-block;
            padding: 6px 14px;
            background: var(--primary-pink);
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .modal-body {
            margin-top: 24px;
        }

        .modal-media {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #FFB6D9 0%, #A8D8FF 100%);
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .modal-text {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .timeline-wrapper {
                flex-direction: column;
            }

            .timeline-item {
                margin-left: 40px;
            }

            .timeline-track.right .timeline-item {
                margin-right: 40px;
            }

            .timeline-item::before {
                left: -32px;
                width: 16px;
                height: 16px;
                border-width: 3px;
            }

            .timeline-track.right .timeline-item::before {
                right: -32px;
            }

            .timeline-track::before {
                left: 16px;
            }

            .timeline-track.right::before {
                right: 16px;
            }

            header h1 {
                font-size: 32px;
            }

            .nav-milestone {
                gap: 8px;
            }

            .milestone-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        /* 交匯線 - 底部視覺效果 */
        .convergence-zone {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.1) 0%, rgba(168, 216, 255, 0.1) 100%);
            border-radius: 24px;
            border: 2px dashed var(--divider);
        }

        .convergence-zone h3 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .convergence-zone p {
            color: var(--text-light);
            font-size: 15px;
        }
    </style>
</head>

            const [filterCategory, setFilterCategory] = useState('all');
            const [searchText, setSearchText] = useState('');
            const containerRef = useRef(null);

            const filterData = (data) => {
                return data.filter(item => {
                    const matchCategory = filterCategory === 'all' || item.category === filterCategory;
                    const matchSearch = 
                        item.title.includes(searchText) || 
                        item.preview.includes(searchText) ||
                        item.fullText.includes(searchText);
                    return matchCategory && matchSearch;
                });
            };

            const filteredRight = filterData(miCometData.right);

                setFilterCategory(category);
            };

                        marginBottom: '20px',
                        fontSize: '14px',

                        {/* 左側時間軸 - 星街彗星視角 */}

                                        key={item.id}
                                        className="timeline-item"
                                        data-category={item.category}
                                    >
                                        <div
                                            className="timeline-card"
                                            onClick={() => setSelectedItem({ ...item, side: 'left' })}
                                        >
                                            <div className="card-header">
                                                <span className="card-date">{item.date}</span>
                                                <span className="card-category">{item.category}</span>
                                            </div>
                                            <h3 className="card-title">{item.title}</h3>
                                            <p className="card-preview">{item.preview}</p>
                                            <div className="card-media-thumb">{item.media}</div>
                                            <div className="card-expand">點擊查看詳情 →</div>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div style={{ padding: '20px', textAlign: 'center', color: '#999' }}>
                                    沒有找到相關故事
                                </div>
                            )}
                        </div>

                        {/* 右側時間軸 - 櫻巫女視角 */}
                        <div className="timeline-track right">
                            <div className="timeline-label">✨ 櫻巫女</div>
                            {filteredRight.length > 0 ? (
                                filteredRight.map((item) => (
                                    <div
                                        key={item.id}
                                        className="timeline-item"
                                        data-category={item.category}
                                    >
                                        <div
                                            className="timeline-card"
                                            onClick={() => setSelectedItem({ ...item, side: 'right' })}
                                        >
                                            <div className="card-header">
                                                <span className="card-date">{item.date}</span>
                                                <span className="card-category">{item.category}</span>
                                            </div>
                                            <h3 className="card-title">{item.title}</h3>
                                            <p className="card-preview">{item.preview}</p>
                                            <div className="card-media-thumb">{item.media}</div>
                                            <div className="card-expand">點擊查看詳情 →</div>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div style={{ padding: '20px', textAlign: 'center', color: '#999' }}>
                                    沒有找到相關故事
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="convergence-zone">
                        <h3>❤️ 兩條線交匯</h3>
                        <p>從 2020 年初次相遇到 2022 年的親密時刻，星街彗星和櫻巫女的故事逐漸靠近，最終交匯成一段溫暖而深厚的羈絆。</p>
                    </div>

                    {/* 詳細內容模態 */}
                    {selectedItem && (
                        <div
                            className="modal-overlay"
                            onClick={() => setSelectedItem(null)}
                        >
                            <div
                                className="modal-content"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <button
                                    className="modal-close"
                                    onClick={() => setSelectedItem(null)}
                                >
                                    ✕
                                </button>

                                <div className="modal-header">
                                    <div className="modal-date">{selectedItem.date}</div>
                                    <h2 className="modal-title">{selectedItem.title}</h2>
                                    <span className="modal-category">
                                        {selectedItem.category}
                                    </span>
                                </div>

                                <div className="modal-media">
                                    {selectedItem.media}
                                </div>

                                <div className="modal-body">
                                    <p className="modal-text">{selectedItem.fullText}</p>
                                    <p className="modal-text" style={{ fontSize: '13px', color: '#999' }}>
                                        💝 miComet - Business 也好，朋友也罷，這是一段永遠珍貴的回憶。
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TimelineApp />);
    </script>
</body>
</html>
