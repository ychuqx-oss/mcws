function App() {
  const [search, setSearch] = React.useState('');
  
  const filtered = TIMELINE.filter(item => {
    const text = (item.title + ' ' + (item.ctx || '')).toLowerCase();
    return text.includes(search.toLowerCase());
  });

  return (
    <div className="container">
      <h1>🌸 miComet 編年史 ⭐</h1>
      <div className="stats">
        共 <strong>{TIMELINE.length}</strong> 個故事 | 2019-2025 年
      </div>
      
      <div className="search-box">
        <input 
          type="text"
          placeholder="搜尋故事..."
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      <div className="timeline">
        {filtered.map(item => (
          <div key={item.id} className="story">
            <div className="story-date">{item.date}</div>
            <div className="story-title">{item.title}</div>
            {item.ctx && <div style={{fontSize: '14px', color: '#cbd5e0'}}>{item.ctx}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
